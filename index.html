</style></head><body><main class="stage"><section class="cover" id="cover" aria-label="食单封面"><div class="seal">东坡食录</div><div class="eyebrow">1037 — 1101 · 随东坡行旅</div><h1>东坡食单</h1><div class="subtitle">一口一城，一生有味</div><p class="intro">从眉山出发，走过乌台诗案的风雨，再去黄州、惠州、儋州。翻开这本食单，看苏轼在不同的日子写下什么。</p><button class="open" type="button" id="open-menu">翻开食单　↗</button></section>
<section class="back-cover" id="back-cover" aria-label="食单封底" hidden><div class="illustration" role="img" aria-label="东坡归途中的书册与茶盏插画"></div><h2>东坡食单</h2><button type="button" id="reopen-menu">再翻开食单</button></section><section class="book" id="menu" aria-label="东坡食单" hidden><aside class="contents"><div class="contents-head"><div><span class="eyebrow" style="color:#9d6144">顺着人生往下翻</span><h2>行旅目录</h2></div><span class="edition">共 16 站 · 自由点阅</span></div><nav class="chapter-list" id="chapters" aria-label="按行旅顺序选择城市"></nav><p class="index-foot">红色一页是乌台诗案：湖州被捕，押往京师御史台。它是一件事，不是一座山。城与城之间的距离为课堂选取，无法穷尽苏轼所有行程。</p></aside><article class="page" id="page" aria-live="polite"></article></section></main>
<script>const stops=[{"id": "meishan", "city": "眉山", "year": "1059", "period": "少年·远行", "phase": "启程", "flavor": "", "icon": "✦", "art": "story-0", "intro": "少年苏轼与父亲、弟弟从蜀地出发。食单从故乡启程。", "situation": "", "mood": "去往远方的一家人", "items": [{"food": "行旅文字", "date": "1059", "type": "诗文", "title": "《初发嘉州》", "quote": "朝发鼓阗阗，西风猎画旃。故乡飘已远，往意浩无边。", "note": "这一站读他的文字与行迹。", "source": "https://ctext.org/wiki.pl?chapter=744612&if=en&remap=gb"}]}, {"id": "kaifeng", "city": "开封", "year": "1057—1061", "period": "应试·入仕", "phase": "求学", "flavor": "", "icon": "✦", "art": "story-1", "intro": "苏轼在京师参加科举，以文章受到赏识，后来应制科并获授凤翔府签判。", "situation": "", "mood": "才华初露。这时他的目光已有对现实事务的追问。", "items": [{"food": "行旅文字", "date": "1057—1061", "type": "诗文", "title": "《省试刑赏忠厚之至论》", "quote": "疑则举而归之于仁。", "note": "这一站读他的文字与行迹。", "source": "https://zh.wikisource.org/wiki/省試刑賞忠厚之至論"}]}, {"id": "fengxiang", "city": "凤翔", "year": "1061—1064", "period": "初次为官", "phase": "初仕", "flavor": "", "icon": "✦", "art": "story-2", "intro": "赴凤翔任职途中，苏轼回信给弟弟子由，想起兄弟旧日同宿渑池的经历。", "situation": "", "mood": "“雪泥鸿爪”写路途无常，兄弟情谊却仍在。", "items": [{"food": "行旅文字", "date": "1061—1064", "type": "诗文", "title": "《和子由渑池怀旧》", "quote": "人生到处知何似，应似飞鸿踏雪泥。\n泥上偶然留指爪，鸿飞那复计东西。\n老僧已死成新塔，坏壁无由见旧题。\n往日崎岖还记否，路长人困蹇驴嘶。", "note": "这首诗写于赴凤翔任职途中，不必说成在凤翔吃到的菜。", "source": "https://zh.wikisource.org/wiki/和子由澠池懷舊", "full": "人生到处知何似，应似飞鸿踏雪泥。\n泥上偶然留指爪，鸿飞那复计东西。\n老僧已死成新塔，坏壁无由见旧题。\n往日崎岖还记否，路长人困蹇驴嘶。"}]}, {"id": "hangzhou", "city": "杭州", "period": "约1072年 · 年轻的东坡", "x": 88, "y": 55, "badge": "吃货名号登场", "flavor": "《老饕赋》", "icon": "🍽️", "art": "story-3", "intro": "在杭州任通判时，苏轼写下《老饕赋》，从锅、火、食材谈到一桌奇想。那时他还年轻，已经敢给自己取个馋嘴的称号。", "situation": "这是乌台诗案前的苏轼。约1072年作于杭州是常见编年说法，具体年份尚有讨论。", "mood": "他会说食材好，也在意新水、净锅与火候。“老饕”这份兴致，在黄州之后仍能见到。", "items": [{"food": "饕餮菜单", "date": "约1072年 · 杭州", "type": "赋", "title": "《老饕赋》", "quote": "庖丁鼓刀，易牙烹熬。水欲新而釜欲洁，火恶陈而薪恶劳。九蒸暴而日燥，百上下而汤鏖。尝项上之一脔，嚼霜前之两螯。烂樱珠之煎蜜，滃杏酪之蒸羔。蛤半熟而含酒，蟹微生而带糟。盖聚物之夭美，以养吾之老饕。", "note": "", "source": "https://zh.wikisource.org/wiki/老饕賦", "full": "庖丁鼓刀，易牙烹熬。水欲新而釜欲洁，火恶陈而薪恶劳。九蒸暴而日燥，百上下而汤鏖。尝项上之一脔，嚼霜前之两螯。烂樱珠之煎蜜，滃杏酪之蒸羔。蛤半熟而含酒，蟹微生而带糟。盖聚物之夭美，以养吾之老饕。"}], "year": "约1072年", "phase": "食味"}, {"id": "mizhou", "city": "密州", "period": "1076年 · 中秋", "x": 84, "y": 18, "badge": "举杯以后", "flavor": "中秋一杯酒", "icon": "🍶", "art": "story-4", "intro": "丙辰中秋，他欢饮达旦，举杯望月，想起远方的弟弟子由。", "situation": "苏轼任密州知州。丙辰中秋作《水调歌头》，小序写下欢饮和思念。", "mood": "", "items": [{"food": "酒", "date": "1076年中秋 · 密州", "type": "词", "title": "《水调歌头·明月几时有》", "quote": "丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间？\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。", "note": "酒见于词序；词中没有记载当晚的菜肴。", "source": "https://zh.wikisource.org/wiki/水調歌頭_(明月幾時有)", "full": "丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间？\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"}], "year": "1076年", "phase": "食味"}, {"id": "xuzhou", "city": "徐州", "period": "1078 · 尚在仕途", "x": 58, "y": 20, "badge": "诗案前", "flavor": "黄瓜与茶", "icon": "🥒", "art": "story-5", "intro": "去石潭谢雨的路上，苏轼看见柳下卖黄瓜的人，走得渴了，又想讨一口茶。这里的食物是乡村生活的一部分。", "situation": "他在徐州任知州。这组词写于谢雨途中，目光落在路边的劳作与人家。", "mood": "此时的苏轼还没有经历乌台诗案。", "items": [{"food": "黄瓜、茶", "date": "1078年 · 徐州", "type": "词", "title": "《浣溪沙·簌簌衣巾落枣花》", "quote": "簌簌衣巾落枣花，村南村北响缫车。牛衣古柳卖黄瓜。\n酒困路长惟欲睡，日高人渴漫思茶。敲门试问野人家。", "note": "词里写卖黄瓜和想喝茶，并未说他买下黄瓜或已经喝到茶。", "source": "https://zh.wikisource.org/wiki/浣溪沙_(蔌蔌衣巾落棗花)", "full": "簌簌衣巾落枣花，村南村北响缫车。牛衣古柳卖黄瓜。\n酒困路长惟欲睡，日高人渴漫思茶。敲门试问野人家。"}], "year": "1078", "phase": "食味"}, {"id": "huzhou", "city": "湖州", "period": "湖州知州 · 诗案前", "x": 87, "y": 37, "badge": "一诗换蟹", "flavor": "朋友送来的蝤蛑", "icon": "🦀", "art": "story-6", "intro": "朋友丁公默送来一对大蟹，苏轼诗中打趣自己：“一诗换得两尖团。”", "situation": "诗中自称“吴兴馋太守”，吴兴即湖州。1079年苏轼知湖州，同年发生乌台诗案；这首诗的具体写作日期未见题注。", "mood": "", "items": [{"food": "蝤蛑（蟹）", "date": "约1079年 · 湖州", "type": "诗", "title": "《丁公默送蝤蛑》", "quote": "溪边石蟹小如钱，喜见轮囷赤玉盘。\n半壳含黄宜点酒，两螯斫雪劝加餐。\n蛮珍海错闻名久，怪雨腥风入座寒。\n堪笑吴兴馋太守，一诗换得两尖团。", "note": "", "source": "https://zh.wikisource.org/wiki/丁公默送蝤蛑", "full": "溪边石蟹小如钱，喜见轮囷赤玉盘。\n半壳含黄宜点酒，两螯斫雪劝加餐。\n蛮珍海错闻名久，怪雨腥风入座寒。\n堪笑吴兴馋太守，一诗换得两尖团。"}], "year": "1079", "phase": "前菜"}, {"id": "wutai", "city": "乌台诗案", "year": "1079", "period": "湖州被捕 → 京师御史台", "phase": "转折", "flavor": "没有菜的一页", "icon": "⚖", "art": "none", "intro": "这一页没有菜。苏轼在湖州被捕，押往京师御史台，数月后贬往黄州。", "situation": "“乌台”是御史台的别称，并非一座山；转折发生在被捕、入狱和贬谪的过程中。", "mood": "", "items": [{"food": "乌台诗案", "date": "1079年 · 湖州至京师", "type": "奏表", "title": "《湖州谢上表》", "quote": "知其愚不适时，难以追陪新进；察其老不生事，或能收养小民。", "note": "", "source": "https://zh.wikisource.org/wiki/湖州謝上表"}]}, {"id": "huangzhou", "city": "黄州", "period": "1080—1084 · 谪居", "x": 44, "y": 47, "badge": "承天寺之夜", "flavor": "鱼、笋与猪肉", "icon": "🍲", "art": "huangzhou", "intro": "1079年乌台诗案后，苏轼到了黄州。眼前有江鱼、竹笋，也有便宜的猪肉；他写下的并非一张饱餐菜单，而是失意日子里的细心与自嘲。", "situation": "1079年乌台诗案后，他于1080年到黄州。种地、做饭、访友，都发生在这段失意而真实的日子里。", "mood": "《初到黄州》先说“老来事业转荒唐”，才写鱼美笋香。《猪肉颂》细说火候，语气又变得活泼。两个苏轼，都是真的。", "items": [{"food": "鱼与笋", "date": "1080年 · 初到黄州", "type": "诗", "title": "《初到黄州》", "quote": "自笑平生为口忙，老来事业转荒唐。长江绕郭知鱼美，好竹连山觉笋香。", "note": "“知鱼美”“觉笋香”写初到时对当地风物的感受，不能当作当天的菜单。", "source": "https://zh.wikisource.org/wiki/初到黃州", "full": "自笑平生为口忙，老来事业转荒唐。\n长江绕郭知鱼美，好竹连山觉笋香。\n逐客不妨员外置，诗人例作水曹郎。\n只惭无补丝毫事，尚费官家压酒囊。", "art": "huangzhou-fish-bamboo-v2"}, {"food": "猪肉", "date": "黄州期间 · 约1080—1084年", "type": "韵文", "title": "《猪肉颂》", "quote": "净洗铛，少著水，柴头罨烟焰不起。待他自熟莫催他，火候足时他自美。", "note": "现存文字未给出确切写作年份；也不宜把它直接等同于今天的“东坡肉”标准做法。", "source": "https://zh.wikisource.org/wiki/豬肉頌", "full": "净洗铛，少著水，柴头罨烟焰不起。待他自熟莫催他，火候足时他自美。黄州好猪肉，价贱如泥土。贵者不肯吃，贫者不解煮。早晨起来打两碗，饱得自家君莫管。", "art": "huangzhou-pork-v2"}, {"food": "一夜月色", "date": "1083年 · 黄州", "type": "小品文", "title": "《记承天寺夜游》", "quote": "何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "note": "这一篇不是食物文字，却是理解“吃货东坡”当时处境的一扇窗。", "source": "https://zh.wikisource.org/wiki/記承天寺夜遊", "full": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。\n庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "art": "huangzhou-moon-v2"}], "bridge": {"label": "把这一站接回《记承天寺夜游》", "text": "1083年，黄州的月色照进屋里，他起身去寻张怀民。会认真煨肉的苏轼，也会在月夜出门；那个“闲人”有一份得闲，也有一重失意。", "source": "https://zh.wikisource.org/wiki/東坡志林/卷一"}, "year": "1080—1084", "phase": "主食"}, {"id": "zhenzhou", "city": "真州一带", "period": "1084年 · 离黄州途中", "x": 67, "y": 48, "badge": "离开黄州", "flavor": "朋友家的豆粥", "icon": "🥣", "art": "story-7", "intro": "黄州的日子刚刚走过，苏轼写豆粥，先讲刘秀和石崇的故事，再落到朋友家的一口粥。“真味”这回不是山珍海味。", "situation": "《豆粥》作于1084年离开黄州后的行旅中，通常系于赴真州一带的途中；诗里回望的是黄州生活。", "mood": "“沙瓶煮豆软如酥”，把一锅平常粥写得细致。并非因为日子从此轻松，而是在普通食物里尝得出朋友的情分。", "items": [{"food": "豆粥", "date": "1084年 · 离黄州途中", "type": "诗", "title": "《豆粥》", "quote": "地碓舂秔光似玉，沙瓶煮豆软如酥。", "note": "", "source": "https://zh.wikisource.org/wiki/豆粥", "full": "君不见滹沱流澌车折轴，公孙仓皇奉豆粥。\n湿薪破灶自燎衣，饥寒顿解刘文叔。\n又不见金谷敲冰草木春，帐下烹煎皆美人。\n萍齑豆粥不传法，咄嗟而办石季伦。\n干戈未解身如寄，声色相缠心已醉。\n身心颠倒自不知，更识人间有真味。\n岂如江头千顷雪色芦，茅檐出没晨烟孤。\n地碓舂秔光似玉，沙瓶煮豆软如酥。\n我老此身无著处，卖书来问东家住。\n卧听鸡鸣粥熟时，蓬头曳履君家去。"}], "year": "1084", "phase": "路餐"}, {"id": "sizhou", "city": "泗州", "period": "1084年腊月 · 离开黄州后", "x": 72, "y": 33, "badge": "一口清欢", "flavor": "茶与春盘", "icon": "🍵", "art": "wine", "intro": "离开黄州之后，他在泗州与友人游南山。午盏里的茶、盘中的春蔬，留下“人间有味是清欢”。", "situation": "词序写明“元丰七年十二月二十四日，从泗州刘倩叔游南山”。这是农历日期，不能简单写成公历1084年12月24日。", "mood": "“清欢”不是大宴席的热闹。细雨、微寒之后，一盏茶和一盘春蔬有了可慢慢品尝的滋味。", "items": [{"food": "茶与春盘", "date": "元丰七年十二月二十四日 · 泗州", "type": "词", "title": "《浣溪沙·细雨斜风作晓寒》", "quote": "雪沫乳花浮午盏，蓼茸蒿笋试春盘。人间有味是清欢。", "note": "“雪沫乳花”写茶汤；“春盘”含春蔬。创作地是泗州，不是黄州。", "source": "https://zh.wikisource.org/wiki/浣溪沙_(蘇軾)", "art": "sizhou-tea-v2"}], "year": "1084年腊月", "phase": "茶点"}, {"id": "kaifeng-return", "city": "开封再访", "year": "1086—1089", "period": "再入朝堂", "phase": "回朝", "flavor": "", "icon": "✦", "art": "story-8", "intro": "离黄州后，苏轼又回到京师，官至翰林学士。人生没有沿着一条笔直的“被贬路线”往下走。", "situation": "", "mood": "这封短札写公文措辞，留下他重新忙于朝务的一面。", "items": [{"food": "行旅文字", "date": "1086—1089", "type": "诗文", "title": "《归院帖》", "quote": "此虽云同归院，亦不云宿于院中。", "note": "这是日常公文书札，不是食物诗文。", "source": "https://www.dpm.org.cn/collection/handwriting/230730.html"}]}, {"id": "hangzhou-return", "city": "杭州再访", "year": "1089—1091", "period": "第二次到杭州", "phase": "重返", "flavor": "", "icon": "✦", "art": "story-9", "intro": "再任杭州知州，苏轼奏请疏浚西湖，以湖泥筑成长堤。", "situation": "", "mood": "年轻时写西湖晴雨，此时要为西湖做具体的事。", "items": [{"food": "行旅文字", "date": "1089—1091", "type": "诗文", "title": "《乞开杭州西湖状》", "quote": "杭州之有西湖，如人之有眉目，盖不可废也。", "note": "这里读治湖奏状，不强配一盘传说中的“西湖鱼”。", "source": "https://zh.wikisource.org/wiki/乞開杭州西湖狀"}]}, {"id": "huizhou", "city": "惠州", "period": "1094—1097 · 岭南谪居", "x": 71, "y": 72, "badge": "荔枝的两面", "flavor": "荔枝与羊脊骨", "icon": "🍒", "art": "huizhou", "intro": "荔枝好吃，但一位远谪的老人也要仔细盘算日常开销。读荔枝诗，再读他给弟弟的羊脊骨信，你会看到不同口味的惠州生活。", "situation": "1094年被贬到惠州。初尝荔枝有喜悦；远离朝廷、家人接连遭遇变故的日子，也不会被一句俏皮话抹去。", "mood": "他肯为鲜果欢喜，也没有把荔枝只看作自己的口福。《荔支叹》追问贡果背后的劳苦，让人看见他的牵挂仍指向别人。", "items": [{"food": "初尝荔枝", "date": "1095年四月十一日 · 惠州", "type": "诗", "title": "《四月十一日初食荔支》", "quote": "海山仙人绛罗襦，红纱中单白玉肤。", "note": "诗题提供了四月十一日；年次据苏轼惠州年谱考为绍圣二年。", "source": "https://zh.wikisource.org/wiki/四月十一日初食荔支", "full": "南村诸杨北村卢，白华青叶冬不枯。\n垂黄缀紫烟雨里，特与荔支为先驱。\n海山仙人绛罗襦，红纱中单白玉肤。\n不须更待妃子笑，风骨自是倾城姝。\n不知天公有意无，遣此尤物生海隅。\n云山得伴松桧老，霜雪自困楂梨粗。\n先生洗盏酌桂醑，冰盘荐此赪虬珠。\n似开江鳐斫玉柱，更洗河豚烹腹腴。\n我生涉世本为口，一官久已轻莼鲈。\n人间何者非梦幻，南来万里真良图。", "art": "huizhou-lychee-v2"}, {"food": "荔枝", "date": "约1095年 · 惠州", "type": "诗", "title": "《荔支叹》", "quote": "宫中美人一破颜，惊尘溅血流千载。", "note": "借荔枝贡运旧事议论百姓负担；这首诗的情绪不能简单归入“乐观”。", "source": "https://zh.wikisource.org/wiki/荔支嘆", "full": "十里一置飞尘灰，五里一堠兵火催。\n颠坑仆谷相枕藉，知是荔支龙眼来。\n飞车跨山鹘横海，风枝露叶如新采。\n宫中美人一破颜，惊尘溅血流千载。\n永元荔支来交州，天宝岁贡取之涪。\n至今欲食林甫肉，无人举觞酹伯游。\n我愿天公怜赤子，莫生尤物为疮痏。\n雨顺风调百谷登，民不饥寒为上瑞。\n君不见武夷溪边粟粒芽，前丁后蔡相笼加。\n争新买宠各出意，今年斗品充官茶。\n吾君所乏岂此物，致养口体何陋耶。\n洛阳相君忠孝家，可怜亦进姚黄花。", "art": "huizhou-lychee-v2"}, {"food": "荔枝与杨梅", "date": "约1096年 · 惠州", "type": "诗", "title": "《食荔支二首》其二", "quote": "罗浮山下四时春，卢橘杨梅次第新。日啖荔支三百颗，不妨长作岭南人。", "note": "“三百颗”是夸张写法。原文作“不妨”，通行引文也有“不辞”异文。", "source": "https://zh.wikisource.org/wiki/食荔支二首（並引）", "full": "罗浮山下四时春，卢橘杨梅次第新。\n日啖荔支三百颗，不妨长作岭南人。", "art": "huizhou-lychee-v2"}, {"food": "羊脊骨", "date": "惠州期间 · 1094—1097年", "type": "书信", "title": "《与子由弟四首》其四", "quote": "惠州市井寥落，然犹日杀一羊，不敢与仕者争买，时嘱屠者买其脊骨耳。", "note": "信中写他的烹法，还担心传开后“众狗不悦”。这是写给弟弟的书信，并非羊肉菜谱广告。", "source": "https://zh.wikisource.org/wiki/與子由弟四首（之四）", "full": "惠州市井寥落，然犹日杀一羊，不敢与仕者争买，时嘱屠者买其脊骨耳。骨间亦有微肉，熟煮热漉出，渍酒中，点薄盐炙微焦食之。终日抉剔，得铢两于肯綮之间，意甚喜之。如食蟹螯，率数日辄一食，甚觉有补。子由三年食堂庖，所食刍豢，没齿而不得骨，岂复知此味乎？戏书此纸遗之，虽戏语，实可施用也。然此说行，则众狗不悦矣。", "art": "huizhou-bones-v2"}], "year": "1094—1097", "phase": "岭南"}, {"id": "danzhou", "city": "儋州", "period": "1097—1100 · 海岛远谪", "x": 46, "y": 86, "badge": "岛上的发现", "flavor": "薯芋、蚝、馓子与茶", "icon": "🦪", "art": "danzhou", "intro": "来到海岛，“吃货”的菜单也会遇到困扰：肉并不常见，乡人吃薯芋；他尝蚝、煎茶。", "situation": "儋州是比惠州更远的一次贬谪。住处和食物都需重新适应；与当地人交往、读书写作，仍在继续。", "mood": "《闻子由瘦》先写难得肉食，再用玩笑安慰弟弟；《食蚝》则珍惜一口新味。会笑的人，也正在过一段艰难日子。", "items": [{"food": "猪肉、鸡粥与薯芋", "date": "儋州期间 · 1097—1100年", "type": "诗", "title": "《闻子由瘦》", "quote": "五日一见花猪肉，十日一遇黄鸡粥。土人顿顿食薯芋。", "note": "写吃肉不易，也写当地日常饮食；不能把这首诗当作他每天实际吃过的菜单。", "source": "https://zh.wikisource.org/wiki/聞子由瘦（儋耳至難得肉食）", "full": "五日一见花猪肉，十日一遇黄鸡粥。\n土人顿顿食薯芋，荐以熏鼠烧蝙蝠。\n旧闻蜜唧尝呕吐，稍近虾蟆缘习俗。\n十年京国厌肥羜，日日烝花压红玉。\n从来此腹负将军，今者固宜安脱粟。\n人言天下无正味，蝍蛆未遽贤麋鹿。\n海康别驾复何为，帽宽带落惊僮仆。\n相看会作两臞仙，还乡定可骑黄鹄。", "art": "danzhou-roots-v2"}, {"food": "生蚝", "date": "1099年冬至前二日 · 儋州", "type": "短文", "title": "《食蚝》（又称《献蚝帖》）", "quote": "己卯冬至前二日，海蛮献蚝……肉与浆入水与酒并煮，食之甚美。", "note": "“己卯”为1099年。这是记食蚝的文字，并非诗；讲述“不要告诉北方人”时宜保留其玩笑口吻。", "source": "https://news.hndaily.cn/html/2024-01/31/content_58484_17027435.htm", "full": "己卯冬至前二日，海蛮献蚝。剖之，得数升。肉与浆入水，与酒并煮，食之甚美，未始有也。又取其大者炙热，正尔啖嚼，又益煮者。每戒过子慎勿说，恐北方君子闻之，争欲为东坡所为，求谪海南，分我此美也。", "art": "danzhou"}, {"food": "馓子（寒具）", "date": "儋州期间？ · 1097—1100年", "type": "诗与宋人笔记", "title": "《寒具》与《鸡肋编》", "quote": "纤手搓来玉数寻，碧油轻蘸嫩黄深。", "note": "《鸡肋编》记“东坡在儋耳”，邻居老妪卖馓子，请他题诗；它所录首句作“纤手搓来玉色匀”，与诗集文本有异。故事地点依据宋人笔记，诗的准确创作年未明。", "source": "https://zh.wikisource.org/wiki/寒具（乃撚頭，出劉禹錫《佳語》）", "extra": ["读《鸡肋编》原文", "https://zh.wikisource.org/wiki/雞肋編/卷上"], "full": "纤手搓来玉数寻，碧油轻蘸嫩黄深。\n夜来春睡浓于酒，压褊佳人缠臂金。", "art": "danzhou-sanzi-v2"}, {"food": "茶", "date": "约1100年 · 儋州", "type": "诗", "title": "《汲江煎茶》", "quote": "大瓢贮月归春瓮，小杓分江入夜瓶。", "note": "借夜间取水与煎茶的动作写景，具体日期不详。", "source": "https://zh.wikisource.org/wiki/汲江煎茶", "full": "活水还须活火烹，自临钓石汲深清。\n大瓢贮月归春瓮，小杓分江入夜瓶。\n雪乳已翻煎处脚，松风仍作泻时声。\n枯肠未易禁三碗，卧听山城长短更。", "art": "danzhou-tea-v2"}], "year": "1097—1100", "phase": "海南"}, {"id": "changzhou", "city": "常州", "year": "1101", "period": "晚年·北归", "phase": "回望", "flavor": "", "icon": "✦", "art": "story-10", "intro": "苏轼北归途中在镇江金山寺题画像，后来病逝于常州。食单到这里合上。", "situation": "", "mood": "回望这一生，他说的偏是三处贬所。那些味道与日子，都走进了他的文字。", "items": [{"food": "行旅文字", "date": "1101", "type": "诗文", "title": "《自题金山画像》", "quote": "心似已灰之木，身如不系之舟。\n问汝平生功业，黄州惠州儋州。", "note": "《自题金山画像》写于镇江，常州是他生命的终点，不混作写诗地点。", "source": "https://zh.wikisource.org/wiki/自題金山畫像", "full": "心似已灰之木，身如不系之舟。\n问汝平生功业，黄州惠州儋州。"}]}],cover=document.getElementById('cover'),backCover=document.getElementById('back-cover'),menu=document.getElementById('menu'),page=document.getElementById('page'),chapters=document.getElementById('chapters');let active=0,timer=null;
const escapeHTML=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const toTitle=p=>p.items[0]?.title||'';
chapters.innerHTML=stops.map((p,i)=>`<button type="button" class="chapter-item ${p.id==='wutai'?'pivot':''}" data-i="${i}" aria-label="第${i+1}站：${escapeHTML(p.city)}，${escapeHTML(toTitle(p))}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${escapeHTML(p.city)}</strong><small>${escapeHTML(p.year)}</small><em>${escapeHTML(toTitle(p))}${p.items.length>1?' · 另有'+(p.items.length-1)+'篇':''}</em></span></button>`).join('');
function draw(i){active=i;const p=stops[i];page.classList.toggle('pivot-page',p.id==='wutai');document.querySelectorAll('.chapter-item').forEach((b,j)=>{b.classList.toggle('current',i===j);i===j?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});const food=p.items.map((o,j)=>`<section class="dish">${(o.art||j===0)?`<div class="art ${escapeHTML(o.art||p.art)}" role="img" aria-label="${escapeHTML(o.title)}的情境插画">${(o.art||p.art)==='none'?escapeHTML(p.icon):''}</div>`:''}<div class="dish-copy"><span class="meta">${escapeHTML(o.date)} · ${escapeHTML(o.food)}</span><h4>${escapeHTML(o.title)}<span class="work-type">${escapeHTML(o.type)}</span></h4><blockquote>“${escapeHTML(o.quote)}”</blockquote>${o.note?`<p>${escapeHTML(o.note)}</p>`:''}${o.full?`<details><summary>展开全文</summary><div class="full-text">${escapeHTML(o.full)}</div></details>`: ''}<a href="${escapeHTML(o.source)}" target="_blank" rel="noopener noreferrer">读原文 ↗</a>${o.extra?`<a href="${escapeHTML(o.extra[1])}" target="_blank" rel="noopener noreferrer">${escapeHTML(o.extra[0])} ↗</a>`:''}</div></section>`).join('');const related=p.bridge?`<p class="related"><b>${escapeHTML(p.bridge.label)}：</b>${escapeHTML(p.bridge.text)} <a href="${escapeHTML(p.bridge.source)}" target="_blank" rel="noopener noreferrer">读原文 ↗</a></p>`:'';page.innerHTML=`<div class="page-head"><h2>东坡食单 · 第 ${String(i+1).padStart(2,'0')} 站</h2><div class="controls"><button type="button" data-dir="prev" ${i===0?'disabled':''} aria-label="翻到上一站">← 上一站</button><button type="button" data-dir="next" ${i===stops.length-1?'disabled':''} aria-label="翻到下一站">下一站 →</button></div></div><div class="folio"><span class="number">${escapeHTML(p.phase)}　·　${escapeHTML(p.period)}</span><span class="year">${escapeHTML(p.year)}</span></div><div class="place-title"><span class="dish-icon" aria-hidden="true">${escapeHTML(p.icon)}</span><h3>${escapeHTML(p.city)}</h3></div>${p.flavor?`<p class="period">今日食味 · ${escapeHTML(p.flavor)}</p>`:''}<p class="lead">${escapeHTML(p.intro)}</p>${p.mood?`<p class="insight">${escapeHTML(p.mood)}</p>`:''}<div class="dishes">${food}</div>${related}<div class="page-footer"><span>原文附于各页 · 绘图为课堂情境插画</span><button type="button" id="close-menu">合上食单</button></div>`;page.querySelector('.controls').addEventListener('click',e=>{const b=e.target.closest('button[data-dir]');if(b)flip(i+(b.dataset.dir==='next'?1:-1))});page.querySelector('#close-menu').addEventListener('click',closeMenu);chapters.querySelector('.current')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function flip(i){if(i<0||i>=stops.length||i===active)return;clearTimeout(timer);page.classList.add('turning');const delay=matchMedia('(prefers-reduced-motion: reduce)').matches?0:180;timer=setTimeout(()=>{draw(i);page.classList.remove('turning');page.scrollTop=0;history.replaceState(null,'','#chapter-'+String(i+1).padStart(2,'0'))},delay)}
function openMenu(i=0){if(!menu.hidden)return;if(!backCover.hidden){backCover.hidden=true;menu.hidden=false;draw(i);menu.scrollIntoView({block:'start',behavior:'smooth'});return}cover.classList.add('opening');const delay=matchMedia('(prefers-reduced-motion: reduce)').matches?0:420;setTimeout(()=>{cover.hidden=true;menu.hidden=false;draw(i);menu.scrollIntoView({block:'start',behavior:'smooth'});history.replaceState(null,'','#chapter-'+String(i+1).padStart(2,'0'))},delay)}
function closeMenu(){menu.hidden=true;backCover.hidden=false;cover.hidden=true;cover.classList.remove('opening');history.replaceState(null,'',location.pathname);backCover.scrollIntoView({block:'start',behavior:'smooth'})}
document.getElementById('open-menu').addEventListener('click',()=>openMenu());document.getElementById('reopen-menu').addEventListener('click',()=>openMenu(active));chapters.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)flip(Number(b.dataset.i))});document.addEventListener('keydown',e=>{if(menu.hidden||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')flip(active+1);if(e.key==='ArrowLeft')flip(active-1)});const direct=location.hash.match(/^#chapter-(\d+)$/);if(direct){cover.hidden=true;menu.hidden=false;draw(Math.min(stops.length-1,Math.max(0,Number(direct[1])-1)))}
</script></body></html>
